name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}, Java ${{ matrix.java }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        java: ['21']
        include:
          - os: ubuntu-latest
            java: '25'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      # The open-source (MIT) cache; the default one is a proprietary component under separate terms.
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Build and test
        run: ./gradlew build --console=plain
      - name: Retrain the explorer, then regenerate the reports, learning curves and README images
        run: |
          ./gradlew run --args="train" --console=plain
          ./gradlew run --args="benchmark" --console=plain
          ./gradlew run --args="learn" --console=plain
          ./gradlew run --args="render" --console=plain
      # Byte for byte, so a line-ending change fails too; git diff alone would normalise it away.
      - name: Fail if any generated file differs from the committed bytes
        run: |
          test -z "$(git status --porcelain -- models reports docs)" || { git status --short -- models reports docs; exit 1; }
          git ls-files -- models reports docs | while read -r file; do
            git show "HEAD:$file" | cmp -s - "$file" || { echo "::error::$file differs from the committed bytes"; exit 1; }
          done
